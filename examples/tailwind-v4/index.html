<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syntyr + Tailwind v4</title><link rel="stylesheet" href="./dist/app.css"></head>
<body><main class="syn-root min-h-screen p-6 md:p-12" data-syn-theme="grid">
<div class="mx-auto max-w-4xl space-y-8"><header class="space-y-3">
<p class="text-syntyr-accent uppercase tracking-widest">Syntyr + Tailwind</p>
<h1 class="syn-display">Application readiness</h1>
<p class="syn-body">Tailwind layout, Syntyr visual language, no Syntyr JavaScript.</p>
</header><section class="grid gap-4 md:grid-cols-2" aria-label="Example components">
<article class="syn-panel bg-syntyr-surface text-syntyr-text">
<h2 class="syn-heading">Campaign performance</h2><p>12 active flights and 4 updates pending approval.</p>
<button class="syn-button syn-button--primary" type="button">Review report</button></article>
<article class="syn-panel" data-syn-theme="noir">
<h2 class="syn-heading text-syntyr-accent">Nested Noir theme</h2>
<p class="text-syntyr-text">These Tailwind utilities resolve scoped Syntyr tokens.</p>
<button class="syn-button syn-button--outline" type="button">Inspect</button></article>
</section></div></main></body></html>

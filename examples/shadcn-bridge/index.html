<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Syntyr / shadcn token compatibility</title><link rel="stylesheet" href="./dist/app.css"></head>
<body><div id="host" style="padding:1rem"><p>Host page untouched by the opt-in bridge.</p>
<section class="syn-root syn-shadcn" data-syn-theme="studio">
  <main class="bg-background text-foreground min-h-screen p-8 space-y-6">
    <h1 class="syn-heading">Scoped shadcn tokens</h1>
    <div class="bg-card text-card-foreground border border-border rounded-lg p-6 space-y-4">
      <p class="text-muted-foreground">Syntyr colors applied through shadcn-style semantic utilities.</p>
      <button type="button" class="bg-primary text-primary-foreground rounded-md px-4 py-2">Confirm</button>
      <button type="button" disabled class="syn-button syn-button--primary">Disabled Syntyr button</button>
    </div>
    <section data-syn-theme="noir" class="bg-card text-card-foreground border border-border rounded-lg p-6">
      <p>Nested Noir theme</p>
      <button type="button" class="bg-primary text-primary-foreground rounded-md px-4 py-2">Noir action</button>
    </section>
  </main>
</section></div></body></html>

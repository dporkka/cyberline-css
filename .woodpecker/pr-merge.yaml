# PR-only integration gate: test PR HEAD merged with the latest main before review.
# This requires Git in CI, but never adds a consumer-side package dependency.
when:
  - event: pull_request

steps:
  - name: composed-main-contract
    image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
      - git --version
      # Docs authoring/test dependency only; never part of the shipped CSS.
      - python3 -m pip install --disable-pip-version-check --no-input -r requirements-docs.txt
      - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow origin; fi
      - git fetch --no-tags origin main
      - python3 scripts/check_merge_candidate.py --base FETCH_HEAD

# Optional development environments only; the distributed CSS has no npm deps.
# Fail PRs for new high/critical npm advisories in the two locked examples.
# Other examples without lockfiles are not yet covered by this audit gate.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: audit-optional-dependency-lockfiles
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    commands:
      - node --version && npm --version
      - npm audit --prefix examples/lit --package-lock-only --ignore-scripts --audit-level=high
      - npm audit --prefix benchmarks/frameworks --package-lock-only --ignore-scripts --audit-level=high

<section class="syn-root syn-region syn-panel" data-syn-theme="studio" aria-labelledby="syn-newsletter-title">
  <p class="syn-eyebrow">STAY INFORMED</p><h2 id="syn-newsletter-title" class="syn-heading">A useful note, not another inbox chore</h2>
  <p>Receive occasional updates and practical guides.</p>
  <form class="syn-form" method="post" action="/newsletter/subscribe">
    <div class="syn-field"><label class="syn-label" for="syn-newsletter-email">Email address</label><input class="syn-input" type="email" id="syn-newsletter-email" name="email" autocomplete="email" required></div>
    <button class="syn-button syn-button--primary" type="submit">Subscribe</button>
  </form>
  <p class="syn-caption">Example only. Provide a real secure endpoint, CSRF protection, consent record and unsubscribe process before enabling this form.</p>
</section>
